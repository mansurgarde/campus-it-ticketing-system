<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submit IT Support Ticket</title>
</head>
<body>
    <h2>Campus IT Support - Submit a New Ticket</h2>
    <form>
        <label>Issue Title:</label><br>
        <input type="text" placeholder="e.g., Projector not working" required><br><br>
        <label>Room / Location:</label><br>
        <input type="text" placeholder="e.g., Hall 2" required><br><br>
        <label>Description:</label><br>
        <textarea rows="4" placeholder="Write problem details..." required></textarea><br><br>
        <button type="submit">Submit Ticket</button>
    </form>
</body>
</html>
